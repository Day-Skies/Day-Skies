<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#274B8F"/>
      <stop offset="0.55" stop-color="#4E93E6"/>
      <stop offset="1" stop-color="#BFE0FF"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.45" cy="0.42" r="0.72">
      <stop offset="0" stop-color="#FFF3C4"/>
      <stop offset="0.6" stop-color="#FFC94D"/>
      <stop offset="1" stop-color="#F5A623"/>
    </radialGradient>
    <linearGradient id="cloud" gradientUnits="userSpaceOnUse" x1="512" y1="470" x2="512" y2="800">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9E7F8"/>
    </linearGradient>
  </defs>
  <!-- Day icon master (docs/icons.md): full-bleed square backdrop, platforms mask it. -->
  <rect id="day:background" width="1024" height="1024" fill="url(#sky)"/>
  <g id="day:foreground">
    <!-- The forecast sky itself: a warm sun slipping behind the day's weather. -->
    <circle cx="430" cy="380" r="172" fill="url(#sun)"/>
    <g fill="url(#cloud)">
      <rect x="292" y="596" width="472" height="140" rx="70"/>
      <circle cx="420" cy="592" r="112"/>
      <circle cx="548" cy="540" r="132"/>
      <circle cx="668" cy="596" r="104"/>
    </g>
  </g>
  <!-- Single-color silhouette for themed/tinted icons (Android 13, Icon Composer Tinted):
       solid paint only, VectorDrawable subset. Hidden so plain viewers show the icon as
       shipped; the pipeline re-enables it. -->
  <g id="day:monochrome" display="none">
    <circle cx="430" cy="380" r="172" fill="#000000"/>
    <rect x="292" y="596" width="472" height="140" rx="70" fill="#000000"/>
    <circle cx="420" cy="592" r="112" fill="#000000"/>
    <circle cx="548" cy="540" r="132" fill="#000000"/>
    <circle cx="668" cy="596" r="104" fill="#000000"/>
  </g>
</svg>
