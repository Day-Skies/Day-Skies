# Day.toml — the Day project manifest (https://daybrite.dev/docs/cli).
#
# `name` and `version` come from Cargo.toml's [package] — they are never restated here.
# Any [app] property can be overridden per platform ([app.ios]), per toolkit ([app.qt]),
# or per target ([app.macos-appkit]); the most specific table wins.
schema = 1

[app]
id = "dev.daybrite.dayskies"
title = "Day Skies"
build = 1
# The 8 shipping platform-toolkit pairs. `windows-xaml`, `linux-gtk`, and `linux-qt` build in CI
# on their native hosts; on a macOS dev box we exercise the toolkits locally as `macos-appkit`,
# `macos-gtk`, `macos-qt`, `ios-uikit`, `android-mdc`, `harmony-arkui`, and `web-dom` (GTK/Qt are portable, so
# `macos-gtk`/`macos-qt` stand in for `linux-gtk`/`linux-qt`). `day build -p <target>` accepts any
# host-buildable target regardless of this list.
targets = [
  "windows-xaml",
  "macos-appkit",
  "linux-gtk",
  "linux-qt",
  "ios-uikit",
  "android-mdc",
  "harmony-arkui",
  "web-dom",
]

# Localization: every directory under `resource/locales/` (en default; also fr, ar, zh-CN) is
# registered by the generated `res::locales::install()` in src/lib.rs. Force a locale at launch with `day launch --locale <bcp47>`.

[window]
width = 960
height = 640
